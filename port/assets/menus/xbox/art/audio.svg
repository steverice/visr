<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <title>AUDIO — angled speaker cabinet and four sound waves</title>
  <desc>Hand-written vector recreation of the approved AUDIO speaker, in American English. Cabinet vertices, projected rings, leaders, and arcs match the raster geometry.</desc>
  <defs>
    <!-- t = (x - 24.9)/170 + y/500; five samples from the approved raster's shading ramp. -->
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="24.9" y1="0" x2="177.28" y2="51.81">
      <stop stop-color="#6d7a84"/><stop offset="0.25" stop-color="#444b52"/>
      <stop offset="0.5" stop-color="#29364a"/><stop offset="0.75" stop-color="#182031"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <filter id="side-shade" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="0.52"/><feFuncG type="linear" slope="0.52"/><feFuncB type="linear" slope="0.52"/></feComponentTransfer></filter>
    <filter id="top-shade" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="0.9"/><feFuncG type="linear" slope="0.9"/><feFuncB type="linear" slope="0.9"/></feComponentTransfer></filter>
    <filter id="front-shade" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="0.72"/><feFuncG type="linear" slope="0.72"/><feFuncB type="linear" slope="0.72"/></feComponentTransfer></filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="linear" slope="1.153846"/></feComponentTransfer>
      <feMorphology operator="dilate" radius="1.5"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2396ff" flood-opacity="0.56"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="url(#shade)" fill-opacity="0.333333">
    <path d="M35 43L58 57V186L35 171Z" filter="url(#side-shade)"/>
    <path d="M35 43L108 26L132 40L58 57Z" filter="url(#top-shade)"/>
    <path d="M58 57L132 40V169L58 186Z" filter="url(#front-shade)"/>
  </g>
  <!-- A skew of -17/74 projects all driver circles onto the angled baffle. -->
  <ellipse cx="0" cy="0" rx="27" ry="34" transform="matrix(1 -0.22972973 0 1 95 127)" fill="#080c10" fill-opacity="0.333333"/>
  <g fill="none" stroke="#298eef" stroke-opacity="0.866667" stroke-linejoin="round" filter="url(#halo)">
    <path d="M35 43L108 26L132 40V169L58 186L35 171Z" stroke-width="1"/>
    <path d="M161.414 75.213A49 49 0 0 1 161.414 140.787
      M177.763 60.492A71 71 0 0 1 177.763 155.508
      M194.112 45.771A93 93 0 0 1 194.112 170.229
      M210.462 31.05A115 115 0 0 1 210.462 184.95" stroke-width="0.85"/>
  </g>
  <g fill="none" stroke="#298eef" stroke-opacity="0.8">
    <path d="M35 43L58 57L132 40" stroke-width="0.7"/>
    <path d="M58 57V186" stroke-width="0.8"/>
    <g transform="matrix(1 -0.22972973 0 1 95 127)">
      <ellipse rx="27" ry="34" stroke-width="0.85"/>
      <ellipse rx="23" ry="29" stroke-width="0.6"/>
      <ellipse rx="9" ry="11" stroke-width="0.65"/>
    </g>
    <ellipse rx="11" ry="13" transform="matrix(1 -0.22972973 0 1 95 76)" stroke-width="0.75"/>
    <path d="M79 168L112 160V163L79 171Z" stroke-width="0.6"/>
  </g>
  <g fill="none" stroke="#2996ff" stroke-opacity="0.733333">
    <path d="M63 61L127 46V164L63 179Z" stroke-width="0.55"/>
    <ellipse rx="18" ry="23" transform="matrix(1 -0.22972973 0 1 95 127)" stroke-width="0.5"/>
    <ellipse rx="7" ry="8" transform="matrix(1 -0.22972973 0 1 95 76)" stroke-width="0.5"/>
    <g stroke-width="0.5">
      <ellipse rx="1.05" ry="1.1" transform="matrix(1 -0.22972973 0 1 67 66)"/>
      <ellipse rx="1.05" ry="1.1" transform="matrix(1 -0.22972973 0 1 122 53)"/>
      <ellipse rx="1.05" ry="1.1" transform="matrix(1 -0.22972973 0 1 67 172)"/>
      <ellipse rx="1.05" ry="1.1" transform="matrix(1 -0.22972973 0 1 122 159)"/>
      <path d="M40 108H20V89H8"/>
    </g>
    <path d="M39 49V166L53 175 M8 84V87 M12 84V87 M16 84V87 M101 188V197H144 M113 196V199 M118 196V199 M123 196V199 M128 196V199 M133 196V199 M138 196V199 M143 196V199" stroke-width="0.45"/>
  </g>
</svg>
