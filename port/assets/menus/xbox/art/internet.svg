<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <title>INTERNET — four devices connected directly to the cloud</title>
  <desc>Hand-written compact blueprint in American English. Mac, iPad, Apple TV with a display, and iPhone each have a separate cloud connection.</desc>
  <defs>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="248" y2="74.4">
      <stop stop-color="#2f3f4e"/><stop offset="1" stop-color="#0e141a"/>
    </linearGradient>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="linear" slope="1.153846"/></feComponentTransfer>
      <feMorphology operator="dilate" radius="1.5"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2396ff" flood-opacity="0.56"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="cloud" d="M122 124C112 124 110 111 118 107C115 96 125 90 133 94C139 81 156 85 159 97C167 93 175 100 173 108C184 110 182 124 172 124Z"/>
    <g id="devices">
      <rect x="33" y="43" width="63" height="43" rx="3"/>
      <path d="M59 86H69L71 96H56Z"/>
      <rect x="35" y="147" width="71" height="51" rx="5"/>
      <rect x="211" y="142" width="31" height="59" rx="6"/>
      <rect x="187" y="43" width="63" height="43" rx="3"/>
      <rect x="183" y="98" width="25" height="10" rx="3"/>
    </g>
  </defs>
  <g fill="url(#surface)" fill-opacity="0.4" stroke="none">
    <use href="#devices"/><use href="#cloud" opacity="0.763889"/>
  </g>
  <g fill="none" stroke="#298eef" stroke-opacity="0.8" stroke-width="0.65" stroke-linejoin="round">
    <!-- Each cable terminates at the cloud boundary; there is no router or shared junction. -->
    <path id="mac-cloud" d="M96 64H105V104H118"/>
    <path id="ipad-cloud" d="M106 173H125V124"/>
    <path id="tv-cloud" d="M183 103H172"/>
    <path id="phone-cloud" d="M211 173H163V124"/>
  </g>
  <g fill="none" stroke="#298eef" stroke-opacity="0.866667" stroke-width="1" stroke-linejoin="round" filter="url(#halo)">
    <use href="#devices"/><use href="#cloud" stroke-width="0.9"/>
  </g>
  <g fill="none" stroke="#298eef" stroke-opacity="0.8" stroke-width="0.6">
    <rect x="37" y="47" width="55" height="33" rx="1"/>
    <rect x="40" y="152" width="61" height="41" rx="2"/>
    <rect x="214" y="145" width="25" height="53" rx="4"/>
    <rect x="191" y="47" width="55" height="33" rx="1"/>
    <path d="M48 98H79 M218.5 86V94H207 M218.5 94H230 M187 103H199 M222 194H232" stroke-width="0.7"/>
    <rect x="220" y="148" width="13" height="3" rx="1.5"/>
  </g>
  <g fill="none" stroke="#2996ff" stroke-opacity="0.733333" stroke-width="0.45">
    <circle cx="70.5" cy="149.5" r="0.8"/><circle cx="203" cy="103" r="0.6"/>
    <path d="M39 135H31V121H24 M224 211H245V205 M235 209V213 M240 209V213 M245 209V213"/>
  </g>
</svg>
