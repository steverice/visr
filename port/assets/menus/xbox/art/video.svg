    <path d="M56 172l-1 3.4 M65.15 172l-1 3.4 M74.31 172l-1 3.4 M83.46 172l-1 3.4 M92.62 172l-1 3.4 M101.77 172l-1 3.4 M110.92 172l-1 3.4 M120.08 172l-1 3.4 M129.23 172l-1 3.4 M138.38 172l-1 3.4 M147.54 172l-1 3.4 M156.69 172l-1 3.4 M165.85 172l-1 3.4
