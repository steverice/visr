<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <title>VIDEO — Mac display, keyboard, and mouse</title>
  <desc>Hand-written vector recreation of the approved VIDEO pilot, in American English.</desc>
  <defs>
    <linearGradient id="surface" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="248" y2="74.4">
      <stop stop-color="#2f3f4e"/><stop offset="1" stop-color="#0e141a"/>
    </linearGradient>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="linear" slope="1.153846"/></feComponentTransfer>
      <feMorphology operator="dilate" radius="1.5"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#2396ff" flood-opacity="0.56"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="outline" fill="none" stroke-linejoin="round">
      <rect x="77" y="28" width="146" height="102" rx="4"/>
      <path d="M77 130H223L218 137H82Z" stroke-width="0.65"/>
      <path d="M139 137H159L162 157H134Z M134 157H162L174 162H123Z" stroke-width="0.8"/>
      <path d="M59 168H171L191 192H39Z"/>
      <rect x="213" y="169" width="24" height="29" rx="10" stroke-width="0.9"/>
    </g>
  </defs>
  <!-- Faces precede the halo, preserving the pilot's layer order. -->
  <g fill="url(#surface)" fill-opacity="0.333333">
    <rect x="77" y="28" width="146" height="102" rx="4"/>
    <path d="M77 130H223L218 137H82Z" opacity="0.666667"/>
    <path d="M139 137H159L162 157H134Z" opacity="0.833333"/>
    <path d="M134 157H162L174 162H123Z" opacity="1.111111"/>
    <path d="M59 168H171L191 192H39Z"/>
    <rect x="213" y="169" width="24" height="29" rx="10"/>
  </g>
  <use href="#outline" stroke="#298eef" stroke-opacity="0.866667" stroke-width="1" filter="url(#halo)"/>
  <g fill="none" stroke="#298eef" stroke-opacity="0.8" stroke-linejoin="round">
    <rect x="84" y="35" width="132" height="81" rx="1" stroke-width="0.7"/>
    <path d="M39 192L40 197H190L191 192 M225 170V181" stroke-width="0.65"/>
    <path d="M80 190H150" stroke-width="1.2"/>
    <rect x="223.4" y="173" width="3.2" height="5" rx="1" stroke-width="0.5"/>
  </g>
