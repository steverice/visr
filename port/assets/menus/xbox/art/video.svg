      M49.4 180.8l-1 3.4 M59.49 180.8l-1 3.4 M69.58 180.8l-1 3.4 M79.68 180.8l-1 3.4 M89.77 180.8l-1 3.4 M99.86 180.8l-1 3.4 M109.95 180.8l-1 3.4 M120.05 180.8l-1 3.4 M130.14 180.8l-1 3.4 M140.23 180.8l-1 3.4 M150.32 180.8l-1 3.4 M160.42 180.8l-1 3.4 M170.51 180.8l-1 3.4
      M46.1 185.2l-1 3.4 M56.66 185.2l-1 3.4 M67.22 185.2l-1 3.4 M77.78 185.2l-1 3.4 M88.35 185.2l-1 3.4 M98.91 185.2l-1 3.4 M109.47 185.2l-1 3.4 M120.03 185.2l-1 3.4 M130.59 185.2l-1 3.4 M141.15 185.2l-1 3.4 M151.72 185.2l-1 3.4 M162.28 185.2l-1 3.4 M172.84 185.2l-1 3.4" stroke-width="0.45"/>
