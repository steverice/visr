schema = 1
name = "iPad Pro 12.9-inch (M1)"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPad13,8", "iPad13,9", "iPad13,10", "iPad13,11"]
and_newer = true

[display]
frame_rate = "120"
render_height = 1080
anisotropic_filtering = 16
shadow_map_size = 512
effect_resolution = "half"
dynamic_resolution = true
upscaler = "metalfx"

[variable.display]
frame_rate = "60"
shadow_map_size = 128

[network]
player_capacity = 128
full_rate_players = 64

[evidence."display.anisotropic_filtering"]
basis = "measured"
why = "16x against off cost 0.1 ms of GPU time a frame."
source = "iPad settings sweep, a10 benchmark at 3180x2384, 2026-10-03"

[evidence."display.shadow_map_size"]
basis = "measured"
why = "1024 cost 0.9 to 2.7 ms of GPU time a frame and 2048 1.3 to 3.1 (the device warmed during the sweep); 128 against 512 made no difference."
source = "iPad settings sweep, a10 benchmark, 2026-10-03"

[evidence."display.effect_resolution"]
basis = "measured"
why = "On c40's mirror floors, full took GPU time from about 9 ms to 13.7 ms a frame and the frame from 8.3 ms to 13.1."
source = "iPad mirror runs, c40, 2026-10-03"

[evidence."display.render_height"]
basis = "measured"
why = "1080 lines is the top of the ladder's 60 frames a second tiers; above it a tier needs 120, which this iPad does not hold. At 1080 the a10 frame averaged 7.2 ms against the 16.7 ms budget, so 1080 keeps headroom for busier scenes than the windows measured. Headroom pass at 128 shadows (campaign windows d40-maw-fight and a10-heroic, round 1, thermal state 0): 120 frames a second at 1080 lines, 1x enemies: d40 96.2% and 95.7% on time in two rounds (115.6 and 115.0 fps), a10 99.92% and 99.97%; at 1.5x enemies d40 89.1%, a10 97.5% and 99.78%. At 1440 lines and 120: d40 61.8% and 69.7% (1.5x), a10 86.3% and 72.0% (1.5x); at 2048 lines d40 38.7%, a10 54.8%. 120 at 1080 does not hold on d40 even at 1x with 128 shadows, so the profile stays at its present tier and no higher tier qualifies; 60 frames a second at 1080 lines held at 99.93% to 100% in every round."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.frame_rate"]
basis = "measured"
why = "Steve 2026-10-27: 120 now, to be confirmed by the tier-ladder check at 1.5x. With MetalFX spatial scaling from 1080 lines to the 3180x2384 panel, presented runs at 120 frames a second were 99.90% on time on a10 and 99.75% on d40 (the device at thermal state 2). Earlier offscreen rounds without the scaler path held only 79.3% (a10) and 75.7% (d40) within 8.3 ms at 1080 lines, so 120 at 1.5x enemies is not yet shown."
source = "Providence a10-heroic and d40-maw-fight presented runs, build d290f06fe (20261026.002743), 2026-10-26; Steve, 2026-10-27"

[evidence."network.player_capacity"]
basis = "measured"
why = "At 30 frames a second, 540 lines, minimum settings and 512 shadows every rung held in two rounds (frames on time): Blood Gulch with 8, 16, 24, 32, 48 and 64 players 100%, with 128 players 100% and 99.94%; Sidewinder with 32 players 99.92% and 100%, 64 and 128 players 100%. 128 is the schema maximum. The earlier 0.4.2 sweep (Blood Gulch with 64 at 13%) predates the multiplayer render fixes."
source = "VISR settings sweep capladder phase, build 20261029.192128 (main e77a24957), presented, 2026-10-30"

[evidence."display.dynamic_resolution"]
basis = "measured"
why = "Presented d40-maw-fight at 1080 and 1600 lines and 120 frames a second: 99.97% and 99.99% of frames on time off, 99.97% and 99.96% on, with short drops of up to three levels and recovery within a second; no cost where the GPU keeps up."
source = "VISR presented benchmark runs, build 20261025.132032, 2026-10-25"

[evidence."display.upscaler"]
basis = "measured"
why = "MetalFX spatial scaling from 1080 lines to the 3180x2384 panel kept every tier held: on time at 60 was 99.98% (d40), 99.93% (a10) and 99.97% (b30) against 99.98%, 99.83% and 100% with bilinear; at 120 it was 99.90% (a10) and 99.75% (d40, the device at thermal state 2) against 99.73% and 99.96%. The scaler adds about 1.0 ms of GPU time a frame (offscreen medians 6.6 against 5.6 ms on a10 and 6.4 against 5.5 on d40). Edges are smoother and detail sharper than the bilinear stretch in same-frame comparisons."
source = "Providence a10-heroic, d40-maw-fight and b30 presented runs, build d290f06fe (20261026.002743), 2026-10-26; offscreen costs from the temporal-aa lane, 2026-10-25"

[evidence."variable.display.shadow_map_size"]
basis = "measured"
why = "Blood Gulch at a fixed 1080 lines and 60 frames a second, 128 shadows: 32 players 99.94% and 99.97% of frames on time, 64 players 99.93% and 99.93% (two rounds each, thermal state 0). At 512 shadows the 64-player game missed badly in the look test on the iPhone 17 Pro (28% on time, 35 fps) while 128 held 99.2%; the iPad Pro (M1) 64-player run at 512 was 50% on time at 60 frames a second in an earlier round. Steve 2026-10-30: 128 is acceptable for the whole variable context."
source = "VISR settings sweep mpshadow phase, build 20261029.192128 (main e77a24957), presented, 2026-10-30"

[evidence."variable.display.frame_rate"]
basis = "measured"
why = "Multiplayer is measured at 60 frames a second (the 120 of the campaign was not run with 32 or more players). Gameplay in a game up to full_rate_players is paced at 60; the campaign keeps 120."
source = "VISR settings sweep, build 20261029.192128 (main e77a24957), presented, 2026-10-30"

[evidence."network.full_rate_players"]
basis = "measured"
why = "At 60 frames a second, a fixed 1080 lines and 128 shadows, Blood Gulch with 64 players held 99.93% of frames on time in two rounds, and with 128 players it did not: 84.5% and 87.0% (49.2 and 49.8 fps). 64 is the largest count measured to hold; counts between 64 and 128 were not run."
source = "VISR settings sweep mpshadow phase, build 20261029.192128 (main e77a24957), presented, 2026-10-30"
