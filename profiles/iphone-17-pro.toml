schema = 1
name = "iPhone 17 Pro"
kind = "model"
status = "provisional"

[match]
platform = "ios"
models = ["iPhone18,1"]
and_newer = true

[display]
frame_rate = "60"
render_height = 1080
anisotropic_filtering = 16
shadow_map_size = 512
anti_aliasing = "fxaa"
dynamic_resolution = true

[variable.display]
frame_rate = "60"

[external.display]
output_height = 1600
render_height = 1600

[network]
player_capacity = 128

[evidence."display.anisotropic_filtering"]
basis = "assumed"
why = "Free on the iPad Pro (M1); this phone's one benchmark ran a10 at 119 frames a second at its native 2622x1206 with 16x on (GPU 5.7 ms)."

[evidence."display.shadow_map_size"]
basis = "assumed"
why = "The default. The phone's settings sweeps were stopped because it ran hot; nothing but the one benchmark is measured."

[evidence."display.anti_aliasing"]
basis = "measured"
why = "FXAA on cost almost nothing on this phone at its native 2622x1206 (Metal, 120 Hz quick suite); every scene held 120 frames a second with it on. GPU mean/p95 in ms, off then on: menu 2.62/2.8 then 5.36/5.8, a10 opening 3.96/6.3 then 4.94/6.4, b30 beach 5.28/6.5 then 5.37/6.3, a10 crew 5.26/6.6 then 5.35/6.6, c40 bridge 5.24/6.5 then 5.45/6.6. The menu's cost is the largest (about 2.7 ms), and still leaves 2.6 ms of the 8.3 ms frame. On by the user's decision."
source = "Reports NMYSEQ6R (off) and 47PS5LC2 (on), iPhone18,1, quick suite, 2026-10-15."

[evidence."display.render_height"]
basis = "measured"
why = "1080 lines, the top of the ladder's 60 frames a second tiers, measured warm; the native 1206 lines were not measured in the sweep. At 1080 the a10 frame averaged 4.2 ms against the 16.7 ms budget."
source = "VISR settings sweep, build 20261024.122832 (0.5.0) with earlier rounds on 20261023.144726, a10-heroic and d40-maw-fight offscreen windows plus one presented d40 run, 2026-10-23 to 2026-10-25"

[evidence."display.frame_rate"]
basis = "measured"
why = "120 frames a second at 1080 lines does not hold: on the Maw fight 99.46%, 99.43% and 99.38% of frames were on time (three rounds), on a10-heroic 99.24%, 99.90% and 99.72%, a window down to 960 lines did no better on the Maw (99.35%, 99.52%, 99.40%), and the phone had reached thermal state 1 in most rounds. At 60 frames a second and 1080 lines, 1.5x enemies put 99.87% to 100% of frames on time and 2x enemies 99.83% to 100% on a10-heroic and the Maw (ladder tier 4), so the profile takes tier 4; 120 at 900 lines held (lowest 99.56%) but is not a ladder tier. Replaces the 2026-10-27 assumption that Pro iPhones target 120 in campaign."
source = "VISR settings sweep, build 20261029.192128 (main e77a24957), presented, warm device, 2026-10-30"

[evidence."variable.display.frame_rate"]
basis = "measured"
why = "60 frames a second at 1080 lines held at 1.5x and 2x enemies, fixed or with a window down to 540 lines, 99.83% to 100% of frames on time on a10-heroic and the Maw (two or three rounds each, thermal state 0 or 1). Multiplayer was measured at 30 frames a second only (32 and 64 players on Blood Gulch, 100%); the 60 frames a second multiplayer measurements are pending. The earlier sweep (build 20261024.122832) put 120 at 93.6% to 98.5% on time at 1080 lines."
source = "VISR settings sweep, build 20261029.192128 (main e77a24957), presented, warm device, 2026-10-30"

[evidence."external.display.output_height"]
basis = "assumed"
why = "Estimated from built-in measurements, not measured on a wired display. A 2560x1600 monitor at its full 1600 lines draws 2560x1600 (4.1 million pixels), 1.3 times the 3.2 million of this phone's native 2622x1206. At native the b30 and a10 scenes cost 5.3 and about 5 ms of GPU at 120 Hz (FXAA on), so about 7 ms scaled by pixel count, against the 16.7 ms budget at the external display's 60 Hz. A 4K monitor is capped to 1600 lines too (2844x1600 at most). The earlier 1080 cap was a placeholder pending measurements."
source = "VISR quick suite reports NMYSEQ6R and 47PS5LC2, iPhone18,1, 2026-10-15; presented iPhone 17 Pro runs, main c6f138a78, 2026-10-26; Steve, 2026-10-27"

[evidence."external.display.render_height"]
basis = "assumed"
why = "Rendering follows the output cap: the drawable is the monitor's own shape at up to 1600 lines, scaled to the monitor by the layer. Estimated, not measured on a wired display; dynamic resolution (on, floor 1080) is the safety net if a monitor proves heavier than estimated."
source = "VISR quick suite reports NMYSEQ6R and 47PS5LC2, iPhone18,1, 2026-10-15; presented iPhone 17 Pro runs, main c6f138a78, 2026-10-26; Steve, 2026-10-27"

[evidence."network.player_capacity"]
basis = "measured"
why = "At 30 frames a second, 540 lines and minimum settings every rung held in two rounds (frames on time): Blood Gulch with 8, 16 and 24 players 99.94% to 100%, 32 players 99.97% and 100%, 48 players 100% and 100%, 64 players 100% and 99.97%, 128 players 100% and 99.94%; Sidewinder with 32 and 64 players 100%, 128 players 100% and 100%. 128 is the schema maximum. At the profile's 1080 lines with fixed resolution Blood Gulch with 128 players missed 30 frames a second (90.0% and 93.1% on time, thermal state 1), so large games depend on the variable-context window. Blood Gulch with 32 and 64 players at 1080 lines held 100% at 30. Multiplayer at 60 frames a second, the variable context's rate, is not yet measured."
source = "VISR settings sweep, build 20261029.192128 (main e77a24957), presented, warm device, 2026-10-30"

[evidence."display.dynamic_resolution"]
basis = "assumed"
why = "Apple GPUs from the A14 on have the stage timing dynamic resolution needs (iPhone 12 Pro measured); at the ceiling it costs nothing, and it lowers the scene only in frames the GPU cannot finish in time."
source = "VISR presented benchmark runs on the iPhone 12 Pro, iPad Pro 12.9-inch (2nd generation) and iPad Pro M1, 2026-10-25"
